<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Fort - Prédictions Football Pro (Scorpion)</title>
    <style>
        :root {
            --bg-color: #0d0607; /* Noir teinté de rouge très sombre */
            --card-bg: #190a0d;  /* Bordeaux/Noir très sombre pour les cartes */
            --accent-color: #dc2626; /* Rouge vif et puissant */
            --accent-hover: #ef4444; /* Rouge lumineux */
            --gold-color: #fbbf24; /* Or / Ambre étincelant */
            --gold-light: #fde047; /* Or clair */
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #2a1217; /* Bordure discrète aux tons bordeaux */
            --home-color: #f87171; /* Rouge doux pour domicile */
            --draw-color: #fbbf24; /* Or pour le nul */
            --away-color: #60a5fa; /* Bleu contrasté pour l'extérieur */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        header h1 {
            color: var(--gold-color);
            margin: 0;
            font-size: 1.4em;
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
        }

        .flashscore-calendar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }
        .flashscore-calendar::-webkit-scrollbar {
            display: none;
        }

        .cal-day-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            min-width: 55px;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .cal-day-btn.active {
            background: linear-gradient(135deg, var(--gold-color), #d97706);
            border-color: var(--gold-light);
            color: #0d0607;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
        }

        .cal-day-name {
            font-size: 0.7em;
            text-transform: uppercase;
        }

        .cal-day-date {
            font-size: 0.9em;
            margin-top: 2px;
        }

        .match-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 12px;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        .match-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75em;
            color: var(--gold-color);
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .list-signal-tag {
            font-size: 0.65em;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .list-signal-tag.fort { background-color: var(--gold-color); color: #0d0607; font-weight: 900; }
        .list-signal-tag.modere { background-color: var(--accent-color); color: #fff; }
        .list-signal-tag.incertain { background-color: #2a1217; color: var(--text-muted); }

        .match-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 0.95em;
            font-weight: 500;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .team-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .match-score {
            font-weight: bold;
            font-size: 1.15em;
            color: var(--gold-color);
        }

        .prono-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-color), #b91c1c);
            color: #fff;
            border: 1px solid var(--accent-hover);
            padding: 10px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 0.9em;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.4);
        }

        .prono-btn:hover {
            background: linear-gradient(135deg, var(--accent-hover), var(--accent-color));
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
        }

        /* --- FENÊTRE MODALE --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(13, 6, 7, 0.9);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--gold-color);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            animation: slideUp 0.3s ease-out;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.6);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.1em;
            color: var(--gold-color);
        }

        .close-modal-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4em;
            cursor: pointer;
        }

        .modal-section {
            background-color: #0d0607;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 12px;
        }

        .modal-section-title {
            font-size: 0.8em;
            text-transform: uppercase;
            color: var(--gold-color);
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .signal-badge-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #190a0d 0%, #0d0607 100%);
            border: 1px solid var(--gold-color);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 12px;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.2);
        }
        .signal-tag {
            font-size: 0.85em;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 6px;
        }
        .signal-tag.fort { background-color: var(--gold-color); color: #0d0607; }
        .signal-tag.modere { background-color: var(--accent-color); color: #fff; }
        .signal-tag.incertain { background-color: #2a1217; color: #fff; }

        .prob-bar-container {
            margin-bottom: 10px;
        }

        .prob-bar-container:last-child {
            margin-bottom: 0;
        }

        .prob-info-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .custom-progress-bg {
            background-color: #2a1217;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
        }

        .custom-progress-fill {
            height: 100%;
            border-radius: 3px;
        }

        .badge-conseil {
            display: inline-block;
            background: var(--accent-color);
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.78em;
            margin-top: 6px;
            font-weight: bold;
        }

        .modal-close-bottom-btn {
            width: 100%;
            background-color: #2a1217;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95em;
            cursor: pointer;
            margin-top: 5px;
            margin-bottom: 10px;
            transition: background 0.2s;
        }

        .modal-close-bottom-btn:hover {
            background-color: #3f1a22;
        }

        @keyframes pulseSkeleton {
            0% { opacity: 0.4; }
            50% { opacity: 0.8; }
            100% { opacity: 0.4; }
        }
        .skeleton {
            background-color: #2a1217;
            border-radius: 6px;
            animation: pulseSkeleton 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ SCORPIO 13 - Football Pro</h1>
    </header>

    <div id="sport-foot">
        <div id="foot-calendar" class="flashscore-calendar"></div>
        <div id="foot-matches"></div>
    </div>

    <!-- FENÊTRE MODALE -->
    <div id="prono-modal" class="modal-overlay" onclick="closeModalOnOutside(event)">
        <div class="modal-container">
            <div class="modal-header">
                <h2 id="modal-match-title">Analyse Match</h2>
                <button class="close-modal-btn" onclick="closeModal()">×</button>
            </div>
            <div id="modal-body"></div>
            <button class="modal-close-bottom-btn" onclick="closeModal()">Fermer</button>
        </div>
    </div>

    <script>
        let selectedFootDate = new Date().toISOString().split('T')[0];
        let cachedFootMatches = {};
        let matchSignalsCache = {};

        function buildCalendar() {
            const container = document.getElementById('foot-calendar');
            container.innerHTML = '';

            const today = new Date();
            for (let i = -3; i <= 3; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() + i);
                const dateStr = d.toISOString().split('T')[0];

                const dayName = d.toLocaleDateString('fr-FR', { weekday: 'short' }).replace('.', '');
                const dayDate = d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'numeric' });

                const btn = document.createElement('button');
                btn.className = 'cal-day-btn';
                if (dateStr === selectedFootDate) {
                    btn.classList.add('active');
                }

                btn.innerHTML = `
                    <div class="cal-day-name">${i === 0 ? 'AJD' : dayName}</div>
                    <div class="cal-day-date">${dayDate}</div>
                `;

                btn.onclick = () => {
                    selectedFootDate = dateStr;
                    loadFootMatches();
                    buildCalendar();
                };
                container.appendChild(btn);
            }
        }

        function closeModal() {
            document.getElementById('prono-modal').style.display = 'none';
        }

        function closeModalOnOutside(event) {
            if (event.target.id === 'prono-modal') {
                closeModal();
            }
        }
